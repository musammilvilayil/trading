services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      STARTING_CAPITAL_INR: "25000"
      LIVE_TRADING_ENABLED: "false"
      MARKET_DATA_MODE: "mock"
  web:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api
